<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INVERNADERO</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to right, #d9e8a1, #a8d5ba);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/*Título */
.titulo {
  font-size: 40px;
  margin: 20px;
  font-weight: bold;
}

/*Imagen */
.imagen {
  width: 220px;
  height: 130px;
  border: 2px dashed black;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 10px;
}

/*Fecha */
.fecha {
  margin: 10px;
}

/*Sensores */
.contenedor {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 10px;
}

.card {
  background: #eee;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

/* Estado servidor */
.estado {
  margin-top: 15px;
  font-weight: bold;
}

/*Botones */
.botones {
  position: fixed;
  bottom: 30px;
  display: flex;
  gap: 15px;
}

button {
  padding: 15px 20px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: #8a8f70;
}

button.activo {
  background: #4caf50;
  color: white;
}
</style>

</head>
<body>

<div class="titulo">PERROS HPTAS</div>

<div class="imagen">Imagen</div>

<div class="fecha" id="fecha"></div>

<div class="contenedor">
  <div class="card">🌱 Suelo: <span id="suelo">--</span>%</div>
  <div class="card">💡 Luz: <span id="luz">--</span>%</div>
  <div class="card">💧 Aire: <span id="aire">--</span>%</div>
  <div class="card">🌡️ Temp: <span id="temp">--</span>°C</div>
</div>

<div class="estado" id="estadoServidor">
  🔴 Conectando...
</div>

<div class="botones">
  <button onclick="toggle('bomba')" id="btnBomba">Bomba OFF</button>
  <button onclick="toggle('ventilador')" id="btnVent">Ventilador OFF</button>
  <button onclick="toggle('luces')" id="btnLuz">Luces OFF</button>
</div>

<script>

//Fecha en tiempo real
setInterval(() => {
  document.getElementById("fecha").innerText =
    new Date().toLocaleString();
}, 1000);

// Obtener datos sensores
setInterval(() => {
  fetch("/datos")
    .then(res => res.json())
    .then(data => {
      document.getElementById("suelo").innerText = data.suelo;
      document.getElementById("aire").innerText = data.aire;
      document.getElementById("temp").innerText = data.temp;
      document.getElementById("luz").innerText = data.luz;
    });
}, 2000);

//Toggle botón
function toggle(dispositivo) {
  fetch("/" + dispositivo, { method: "POST" })
    .then(res => res.json())
    .then(data => {
      actualizarBoton(dispositivo, data.estado);
    });
}

//Actualizar botones
function actualizarBoton(dispositivo, estado) {
  let btn;

  if (dispositivo === "bomba") btn = document.getElementById("btnBomba");
  if (dispositivo === "ventilador") btn = document.getElementById("btnVent");
  if (dispositivo === "luces") btn = document.getElementById("btnLuz");

  btn.innerText = dispositivo.toUpperCase() + " " + estado;

  if (estado === "ON") {
    btn.classList.add("activo");
  } else {
    btn.classList.remove("activo");
  }
}

// Estado servidor + sincronización
setInterval(() => {
  fetch("/estado")
    .then(res => res.json())
    .then(data => {

      let estado = document.getElementById("estadoServidor");

      if (data.esp32) {
        estado.innerText = "🟢 Servidor conectado";
      } else {
        estado.innerText = "🔴 Servidor desconectado";
      }

      actualizarBoton("bomba", data.dispositivos.bomba ? "ON" : "OFF");
      actualizarBoton("ventilador", data.dispositivos.ventilador ? "ON" : "OFF");
      actualizarBoton("luces", data.dispositivos.luces ? "ON" : "OFF");
    })
    .catch(() => {
      document.getElementById("estadoServidor").innerText =
        "🔴 Sin conexión al servidor";
    });

}, 2000);

</script>

</body>
</html>
