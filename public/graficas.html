<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Historial - Invernadero</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #d9e8a1, #a8d5ba);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  min-height: 100vh;
  color: #333;
}

h1 {
  font-size: 36px;
  color: #2c5530;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
  margin-bottom: 10px;
  font-weight: bold;
}

h2 {
  font-size: 22px;
  color: #2c5530;
  margin: 30px 0 20px 0;
  font-weight: bold;
  text-align: center;
}

/* Botón volver */
.volver-btn {
  padding: 14px 28px;
  border-radius: 25px;
  border: none;
  background: linear-gradient(145deg, #8a8f70, #6b7a4f);
  color: white;
  font-weight: bold;
  font-size: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: all 0.3s ease;
  margin-bottom: 30px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.volver-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Calendario */
#fecha {
  padding: 14px 20px;
  border: 3px solid #4CAF50;
  border-radius: 15px;
  font-size: 16px;
  background: white;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  margin-bottom: 40px;
  width: 280px;
  max-width: 100%;
  transition: all 0.3s;
}

#fecha:focus {
  outline: none;
  border-color: #45a049;
  box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2), 0 6px 20px rgba(0,0,0,0.15);
}

/* Contenedor gráficas */
.graficas-container {
  max-width: 1200px;
  width: 100%;
}

.grafica-item {
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 30px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
}

.grafica-canvas {
  max-height: 300px;
  width: 100%;
}

/* Loading */
.loading {
  text-align: center;
  color: #666;
  font-size: 18px;
  padding: 60px 20px;
  font-style: italic;
}

.loading::after {
  content: "⏳ Cargando datos...";
  display: block;
  font-size: 14px;
  margin-top: 10px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* Error */
.error {
  background: linear-gradient(145deg, #ffebee, #ffcdd2) !important;
  border: 3px solid #f44336 !important;
  color: #d32f2f;
  text-align: center;
  padding: 30px;
  border-radius: 15px;
  font-weight: bold;
}

.error::before {
  content: "🔴 ";
  font-size: 24px;
}

/* Responsive */
@media (max-width: 768px) {
  body { padding: 20px 15px; }
  h1 { font-size: 28px; }
  #fecha { width: 100%; }
  .grafica-item { padding: 20px 15px; }
  .grafica-canvas { max-height: 250px; }
}

@media (max-width: 480px) {
  .volver-btn { width: 100%; justify-content: center; }
}
  </style>
</head>
<body>

<h1>📊 Historial Completo</h1>

<button class="volver-btn" onclick="volver()">
  ← Volver al Dashboard
</button>

<input type="date" id="fecha">

<div class="graficas-container">
  <!-- GRÁFICA 1: SUELO -->
  <div class="grafica-item">
    <h2>🌱 Humedad del Suelo</h2>
    <canvas id="graficaSuelo" class="grafica-canvas"></canvas>
  </div>

  <!-- GRÁFICA 2: TEMPERATURA -->
  <div class="grafica-item">
    <h2>🌡️ Temperatura</h2>
    <canvas id="graficaTemp" class="grafica-canvas"></canvas>
  </div>

  <!-- GRÁFICA 3: AIRE -->
  <div class="grafica-item">
    <h2>💧 Humedad Ambiente</h2>
    <canvas id="graficaAire" class="grafica-canvas"></canvas>
  </div>

  <!-- GRÁFICA 4: LUZ -->
  <div class="grafica-item">
    <h2>💡 Nivel de Luz</h2>
    <canvas id="graficaLuz" class="grafica-canvas"></canvas>
  </div>

  <!-- GRÁFICA 5: COMPARATIVA -->
  <div class="grafica-item">
    <h2>📈 Comparativa Completa</h2>
    <canvas id="graficaCompleta" class="grafica-canvas"></canvas>
  </div>
</div>

<script>
// ← VOLVER
function volver() {
  window.location.href = "/dashboard.html";
}

// Objetos Chart
let charts = {};

// Configuración común
const configBase = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: {
      labels: {
        font: { size: 14, family: 'Arial' },
        color: '#2c5530',
        padding: 20
      }
    }
  },
  scales: {
    y: {
      grid: { color: 'rgba(44, 85, 48, 0.1)' },
      ticks: { color: '#555', font: { size: 12 } },
      beginAtZero: true
    },
    x: {
      grid: { color: 'rgba(44, 85, 48, 0.1)' },
      ticks: { color: '#555', font: { size: 11 }, maxTicksLimit: 12 }
    }
  },
  animation: {
    duration: 800,
    easing: 'easeOutQuart'
  }
};

const colores = {
  suelo: '#4CAF50',
  temp: '#FF9800',
  aire: '#2196F3',
  luz: '#FFEB3B'
};

//LIMPIAR ERRORES
function limpiarErrores() {
  document.querySelectorAll('.overlay-error').forEach(el => el.remove());
}

//LOADING SUAVE
function mostrarLoading() {
  document.querySelectorAll('canvas').forEach(canvas => {
    canvas.style.opacity = 0.3;
  });
}

//ERROR SIN ROMPER DOM
function mostrarError(mensaje) {
  document.querySelectorAll('.grafica-item').forEach(item => {

    let overlay = item.querySelector('.overlay-error');

    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'overlay-error';
      item.style.position = "relative";
      item.appendChild(overlay);
    }

    overlay.innerHTML = `
      <div style="
        position:absolute;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(255,255,255,0.85);
        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        font-weight:bold;
        color:#555;
      ">
        😔 No hay datos<br>
        <small>${mensaje}</small>
      </div>
    `;
  });
}

//DESTRUIR CHARTS
function destruirCharts() {
  Object.values(charts).forEach(chart => {
    if (chart && typeof chart.destroy === 'function') {
      chart.destroy();
    }
  });
  charts = {};
}

//CREAR GRÁFICA SEGURA
function actualizarGrafica(idCanvas, labels, data, titulo, color) {
  const canvas = document.getElementById(idCanvas);
  if (!canvas) return;

  if (charts[idCanvas]) {
    charts[idCanvas].destroy();
  }

  charts[idCanvas] = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: titulo,
        data,
        borderColor: color,
        backgroundColor: color + '20',
        borderWidth: 3,
        fill: true,
        tension: 0.4,
        pointRadius: 4
      }]
    },
    options: {
      ...configBase,
      plugins: {
        ...configBase.plugins,
        title: {
          display: true,
          text: titulo
        }
      }
    }
  });
}

//CARGAR DATOS
async function cargarDatos(fecha) {
  try {
    limpiarErrores();

    const res = await fetch(`/historial/${fecha}`);
    const data = await res.json();

    if (!data || data.length === 0) {
      destruirCharts();
      mostrarError("No hay datos para esta fecha");
      return;
    }

    const horas = data.map(d =>
      new Date(d.created_at).toLocaleTimeString('es-CO', {
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'America/Bogota'
      })
    );

    // Restaurar opacidad
    document.querySelectorAll('canvas').forEach(c => c.style.opacity = 1);

    destruirCharts();

    actualizarGrafica('graficaSuelo', horas, data.map(d => d.suelo || 0), 'Humedad Suelo %', colores.suelo);
    actualizarGrafica('graficaTemp', horas, data.map(d => d.temperatura || 0), 'Temperatura °C', colores.temp);
    actualizarGrafica('graficaAire', horas, data.map(d => d.aire || 0), 'Humedad Aire %', colores.aire);
    actualizarGrafica('graficaLuz', horas, data.map(d => d.luz || 0), 'Nivel Luz %', colores.luz);

    //GRÁFICA COMPLETA
    const canvasCompleta = document.getElementById('graficaCompleta');
    if (canvasCompleta) {
      charts.graficaCompleta = new Chart(canvasCompleta, {
        type: 'line',
        data: {
          labels: horas,
          datasets: [
            { label: 'Suelo', data: data.map(d => d.suelo || 0), borderColor: colores.suelo },
            { label: 'Temp', data: data.map(d => d.temperatura || 0), borderColor: colores.temp },
            { label: 'Aire', data: data.map(d => d.aire || 0), borderColor: colores.aire },
            { label: 'Luz', data: data.map(d => d.luz || 0), borderColor: colores.luz }
          ]
        },
        options: configBase
      });
    }

  } catch (error) {
    console.error(error);
    mostrarError("Error cargando datos");
  }
}

//EVENTO FECHA
document.getElementById("fecha").addEventListener("change", async (e) => {
  const fecha = e.target.value;
  if (!fecha) return;

  mostrarLoading();
  await cargarDatos(fecha);
});

//CARGA INICIAL
document.addEventListener('DOMContentLoaded', () => {
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('fecha').value = hoy;
  cargarDatos(hoy);
});
</script>

</body>
</html>
