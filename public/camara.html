<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Galería - Invernadero</title>
  <style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #d9e8a1 0%, #a8d5ba 50%, #87c4a3 100%);
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* Header fijo */
.header {
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  padding: 20px 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.titulo {
  font-size: 36px;
  font-weight: 800;
  background: linear-gradient(135deg, #2c5530, #4CAF50);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin: 0;
  letter-spacing: -0.5px;
}

.controles {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.filtros {
  display: flex;
  gap: 12px;
  align-items: center;
  background: rgba(255,255,255,0.9);
  padding: 12px 20px;
  border-radius: 25px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
  backdrop-filter: blur(10px);
}

#fechaInput {
  padding: 12px 16px;
  border: 2px solid #4CAF50;
  border-radius: 20px;
  font-size: 16px;
  background: white;
  color: #333;
  font-weight: 500;
  transition: all 0.3s;
  min-width: 180px;
}

#fechaInput:focus {
  outline: none;
  border-color: #45a049;
  box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
  transform: scale(1.02);
}

.btn-filtrar, .btn-limpiar {
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-filtrar {
  background: linear-gradient(135deg, #4CAF50, #45a049);
  color: white;
}

.btn-filtrar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
}

.btn-limpiar {
  background: linear-gradient(135deg, #8a8f70, #6b7a4f);
  color: white;
}

.btn-limpiar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(138, 143, 112, 0.4);
}

.estado {
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  margin-left: 10px;
}

.estado.conectado {
  background: linear-gradient(135deg, #4CAF50, #45a049);
  color: white;
}

.estado.desconectado {
  background: linear-gradient(135deg, #f44336, #d32f2f);
  color: white;
  animation: pulsoRojo 2s infinite;
}

/* Galería Instagram */
.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 10px;
}

.img-card {
  position: relative;
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
}

.img-card:hover {
  transform: translateY(-12px) scale(1.02);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

.img-card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  transition: transform 0.4s;
}

.img-card:hover img {
  transform: scale(1.05);
}

.info {
  padding: 18px;
  background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
}

.fecha {
  font-size: 14px;
  color: #666;
  font-weight: 500;
  margin: 0;
}

.hora {
  font-size: 13px;
  color: #999;
  margin-top: 4px;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(45deg, rgba(76,175,80,0.9), rgba(69,160,73,0.9));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 0.3s;
  color: white;
  font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.img-card:hover .overlay {
  opacity: 1;
}

.icono-camara {
  font-size: 48px;
  margin-bottom: 10px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

/* Botón volver fijo */
.volver {
  position: fixed;
  top: 25px;
  left: 25px;
  z-index: 1000;
  padding: 14px 20px;
  border-radius: 50px;
  background: rgba(255,255,255,0.95);
  border: none;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  color: #2c5530;
  transition: all 0.3s;
  backdrop-filter: blur(20px);
}

.volver:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

/* Animaciones */
@keyframes pulsoRojo {
  0%, 100% { box-shadow: 0 0 20px rgba(244,67,54,0.5); }
  50% { box-shadow: 0 0 30px rgba(244,67,54,0.8); }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.img-card {
  animation: fadeInUp 0.6s ease-out forwards;
}

.img-card:nth-child(1) { animation-delay: 0.1s; }
.img-card:nth-child(2) { animation-delay: 0.2s; }
.img-card:nth-child(3) { animation-delay: 0.3s; }

/* Responsive */
@media (max-width: 768px) {
  .galeria {
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
  }
  .titulo { font-size: 28px; }
  .controles { flex-direction: column; gap: 15px; }
  .filtros { width: 100%; justify-content: center; }
}

@media (max-width: 480px) {
  .galeria {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  body { padding: 15px; }
}
  </style>
</head>
<body>

<button class="volver" onclick="volver()">⬅️ Dashboard</button>

<div class="header">
  <h1 class="titulo">📸 Feed del Invernadero</h1>
  
  <div class="controles">
    <div class="filtros">
      <input type="date" id="fechaInput">
      <button class="btn-filtrar" onclick="filtrar()">
        🔍 Filtrar
      </button>
      <button class="btn-limpiar" onclick="limpiarFiltro()">
        🧹 Limpiar
      </button>
      <div class="estado conectado" id="estadoFeed">🟢 Live</div>
    </div>
  </div>
</div>

<div class="galeria" id="galeria"></div>

<script>
let modoFiltro = false;
let intervalo = null;
let contadorActualizaciones = 0;

function volver() {
  window.location.href = "/";
}

async function actualizarEstado(online) {
  const estado = document.getElementById('estadoFeed');
  if (online) {
    estado.textContent = '🟢 Live';
    estado.className = 'estado conectado';
  } else {
    estado.textContent = '🔴 Offline';
    estado.className = 'estado desconectado';
  }
}

async function cargarImagenes() {
  try {
    const res = await fetch("/imagenes");
    const data = await res.json();
    renderizar(data);
    actualizarEstado(true);
    contadorActualizaciones++;
  } catch (error) {
    console.error('Error cargando imágenes:', error);
    actualizarEstado(false);
    document.getElementById('galeria').innerHTML = 
      '<div style="text-align:center;padding:60px;color:#666;font-size:18px;">🔌 Conectando con cámara...</div>';
  }
}

async function filtrar() {
  const fecha = document.getElementById("fechaInput").value;
  
  if (!fecha) {
    limpiarFiltro();
    return;
  }

  modoFiltro = true;
  clearInterval(intervalo);
  
  try {
    document.getElementById('galeria').innerHTML = 
      '<div style="text-align:center;padding:60px;color:#666;font-size:18px;">🔍 Filtrando imágenes...</div>';
    
    const res = await fetch(`/imagenes/${fecha}`);
    const data = await res.json();
    renderizar(data);
    actualizarEstado(true);
  } catch (error) {
    console.error('Error filtro:', error);
    document.getElementById('galeria').innerHTML = 
      '<div style="text-align:center;padding:60px;color:#f44336;font-weight:bold;">❌ No hay imágenes para esta fecha</div>';
  }
}

function limpiarFiltro() {
  modoFiltro = false;
  document.getElementById("fechaInput").value = "";
  iniciarAutoRefresh();
  cargarImagenes();
}

function renderizar(lista) {
  const galeria = document.getElementById("galeria");
  
  if (lista.length === 0) {
    galeria.innerHTML = `
      <div style="grid-column: 1 / -1; text-align:center; padding:80px; color:#666; font-size:18px;">
        📷 No hay imágenes disponibles
        <br><small>Intenta otra fecha o espera nuevas capturas</small>
      </div>
    `;
    return;
  }

  galeria.innerHTML = "";
  
  lista.slice().reverse().forEach((img, index) => {
    const div = document.createElement("div");
    div.className = "img-card";
    div.style.animationDelay = `${index * 0.05}s`;
    
    const fecha = new Date(img.created_at);
    const fechaFormato = fecha.toLocaleDateString('es-ES');
    const horaFormato = fecha.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
    
    div.innerHTML = `
      <img src="${img.url}" alt="Invernadero ${horaFormato}" loading="lazy" />
      <div class="overlay">
        <div class="icono-camara">📷</div>
        <div style="font-size:18px; margin-bottom:8px;">Ver imagen</div>
        <div style="font-size:14px; opacity:0.9;">${horaFormato}</div>
      </div>
      <div class="info">
        <div class="fecha">${fechaFormato}</div>
        <div class="hora">${horaFormato}</div>
      </div>
    `;
    
    div.onclick = () => {
      window.open(img.url, '_blank');
    };
    
    galeria.appendChild(div);
  });
}

function iniciarAutoRefresh() {
  clearInterval(intervalo);
  intervalo = setInterval(() => {
    if (!modoFiltro) {
      cargarImagenes();
    }
  }, 60000);
}

// Inicializar
document.addEventListener('DOMContentLoaded', () => {
  // Fecha de hoy por defecto
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('fechaInput').value = hoy;
  
  cargarImagenes();
  iniciarAutoRefresh();
});
</script>

</body>
</html>
