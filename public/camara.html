<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Galería - Invernadero</title>
  <style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #d9e8a1 0%, #a8d5ba 50%, #87c4a3 100%);
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

/* Header fijo */
.header {
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  padding: 20px 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.titulo {
  font-size: 36px;
  font-weight: 800;
  background: linear-gradient(135deg, #2c5530, #4CAF50);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin: 0;
  letter-spacing: -0.5px;
}

.controles {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.filtros {
  display: flex;
  gap: 12px;
  align-items: center;
  background: rgba(255,255,255,0.9);
  padding: 12px 20px;
  border-radius: 25px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
  backdrop-filter: blur(10px);
}

#fechaInput {
  padding: 12px 16px;
  border: 2px solid #4CAF50;
  border-radius: 20px;
  font-size: 16px;
  background: white;
  color: #333;
  font-weight: 500;
  transition: all 0.3s;
  min-width: 180px;
}

#fechaInput:focus {
  outline: none;
  border-color: #45a049;
  box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
  transform: scale(1.02);
}

.btn-filtrar, .btn-limpiar, .btn-timelapse {
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-filtrar {
  background: linear-gradient(135deg, #4CAF50, #45a049);
  color: white;
}

.btn-filtrar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
}

.btn-limpiar {
  background: linear-gradient(135deg, #8a8f70, #6b7a4f);
  color: white;
}

.btn-limpiar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(138, 143, 112, 0.4);
}

.btn-timelapse {
  background: linear-gradient(135deg, #FF6B35, #F7931E);
  color: white;
  animation: pulsoNaranja 2s infinite;
}

.btn-timelapse:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
}

.btn-timelapse.pausado {
  background: linear-gradient(135deg, #666, #888);
  animation: none;
}

.btn-timelapse.pausado:hover {
  box-shadow: 0 8px 25px rgba(102, 102, 102, 0.4);
}

/* Modal Timelapse - SIMPLE */
.modal-timelapse {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.98);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-timelapse.mostrar {
  display: flex;
}

.video-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  max-height: 90vh;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
}

#timelapseVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.cerrar-modal {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
  z-index: 10;
}

.cerrar-modal:hover {
  background: rgba(255,255,255,0.4);
  transform: scale(1.1);
}

.btn-reiniciar {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(76,175,80,0.9);
  border: none;
  color: white;
  padding: 14px 24px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
  opacity: 0;
  pointer-events: none;
  z-index: 10;
}

.btn-reiniciar.visible {
  opacity: 1;
  pointer-events: auto;
  animation: bounceIn 0.5s ease-out;
}

.btn-reiniciar:hover {
  background: rgba(76,175,80,1);
  transform: translateX(-50%) translateY(-2px);
  box-shadow: 0 8px 25px rgba(76,175,80,0.4);
}

@keyframes bounceIn {
  0% { transform: translateX(-50%) scale(0.3); opacity: 0; }
  50% { transform: translateX(-50%) scale(1.05); }
  70% { transform: translateX(-50%) scale(0.9); }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

/* Galería Instagram */
.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 10px;
}

.img-card {
  position: relative;
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
}

.img-card:hover {
  transform: translateY(-12px) scale(1.02);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

.img-card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  transition: transform 0.4s;
}

.img-card:hover img {
  transform: scale(1.05);
}

.info {
  padding: 18px;
  background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
}

.fecha {
  font-size: 14px;
  color: #666;
  font-weight: 500;
  margin: 0;
}

.hora {
  font-size: 13px;
  color: #999;
  margin-top: 4px;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(45deg, rgba(76,175,80,0.9), rgba(69,160,73,0.9));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 0.3s;
  color: white;
  font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.img-card:hover .overlay {
  opacity: 1;
}

.icono-camara {
  font-size: 48px;
  margin-bottom: 10px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

/* Botón volver fijo */
.volver {
  position: fixed;
  top: 25px;
  left: 25px;
  z-index: 1000;
  padding: 14px 20px;
  border-radius: 50px;
  background: rgba(255,255,255,0.95);
  border: none;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  color: #2c5530;
  transition: all 0.3s;
  backdrop-filter: blur(20px);
}

.volver:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

/* Animaciones */
@keyframes pulsoNaranja {
  0%, 100% { box-shadow: 0 0 20px rgba(255,107,53,0.5); }
  50% { box-shadow: 0 0 30px rgba(255,107,53,0.8); }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.img-card {
  animation: fadeInUp 0.6s ease-out forwards;
}

.img-card:nth-child(1) { animation-delay: 0.1s; }
.img-card:nth-child(2) { animation-delay: 0.2s; }
.img-card:nth-child(3) { animation-delay: 0.3s; }

/* Responsive */
@media (max-width: 768px) {
  .galeria {
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
  }
  .titulo { font-size: 28px; }
  .controles { flex-direction: column; gap: 15px; }
  .filtros { width: 100%; justify-content: center; }
  .video-container { max-width: 95vw; }
}

@media (max-width: 480px) {
  .galeria {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  body { padding: 15px; }
}
  </style>
</head>
<body>

<button class="volver" onclick="volver()">⬅️ Dashboard</button>

<div class="header">
  <h1 class="titulo">📸 Feed del Invernadero</h1>
  
  <div class="controles">
    <div class="filtros">
      <input type="date" id="fechaInput">
      <button class="btn-filtrar" onclick="filtrar()">
        🔍 Filtrar
      </button>
      <button class="btn-limpiar" onclick="verTodas()">
         📷 Ver todas
      </button>
      <button class="btn-timelapse" id="btnTimelapse">
        ▶️ Timelapse
      </button>
    </div>
  </div>
</div>

<div class="galeria" id="galeria"></div>

<!-- Modal Timelapse - SIMPLE -->
<div class="modal-timelapse" id="modalTimelapse">
  <div class="video-container">
    <button class="cerrar-modal" onclick="cerrarTimelapse()">✕</button>
    <video id="timelapseVideo" muted playsinline></video>
    <button class="btn-reiniciar" id="btnReiniciar" onclick="reiniciarTimelapse()" title="Reiniciar">🔄 Reiniciar</button>
  </div>
</div>

<script>
let modoFiltro = false;
let intervalo = null;
let imagenesActuales = [];
let reproduciendo = false;
let frameActual = 0;
let totalFrames = 0;
let intervaloFrames = null;
let canvas = null;
let ctx = null;
let stream = null;
let timelapseFinalizado = false;

function volver() {
  window.location.href = "/dashboard.html";
}

async function cargarImagenes() {
  try {
    const res = await fetch("/imagenes");
    if (!res.ok) throw new Error('Error en respuesta');
    const data = await res.json();
    imagenesActuales = data;
    renderizar(data);
    return data;
  } catch (error) {
    console.error('Error cargando imágenes:', error);
    mostrarErrorTemporal('🔌 Conectando con cámara...');
    return [];
  }
}

function mostrarErrorTemporal(mensaje) {
  const galeria = document.getElementById('galeria');
  galeria.innerHTML = `<div style="grid-column: 1 / -1; text-align:center;padding:60px;color:#666;font-size:18px;">${mensaje}</div>`;
}

async function verTodas() {
  modoFiltro = false;
  document.getElementById("fechaInput").value = "";
  
  mostrarErrorTemporal('📱 Cargando todas las imágenes...');
  
  try {
    const data = await cargarImagenes();
    if (data.length === 0) {
      mostrarErrorTemporal('📷 No hay imágenes disponibles');
    }
  } catch (error) {
    console.error('Error en verTodas:', error);
  }
  
  iniciarAutoRefresh();
}

function reiniciarTimelapse() {
  frameActual = 0;
  timelapseFinalizado = false;
  document.getElementById('btnReiniciar').classList.remove('visible');
  
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }
  
  crearStreamVideo();
}

function crearStreamVideo() {
  const video = document.getElementById('timelapseVideo');
  const fps = 30;
  stream = canvas.captureStream(fps);
  video.srcObject = stream;
}

async function crearTimelapse() {
  try {
    const modal = document.getElementById('modalTimelapse');
    const video = document.getElementById('timelapseVideo');
    
    if (imagenesActuales.length === 0) {
      alert('No hay imágenes para el timelapse');
      return;
    }
    
    // Crear canvas
    canvas = document.createElement('canvas');
    ctx = canvas.getContext('2d');
    canvas.width = 1280;
    canvas.height = 720;
    
    totalFrames = imagenesActuales.length;
    
    crearStreamVideo();
    
    // Generar frames
    intervaloFrames = setInterval(() => {
      if (frameActual < totalFrames && !timelapseFinalizado) {
        const imgData = imagenesActuales[frameActual];
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          frameActual++;
          
          // FINALIZAR cuando llega al final
          if (frameActual >= totalFrames) {
            timelapseFinalizado = true;
            document.getElementById('btnReiniciar').classList.add('visible');
          }
        };
        img.onerror = () => {
          frameActual++; // Saltar frame fallido
        };
        img.src = imgData.url;
      }
    }, 100);

    video.onloadedmetadata = () => {
      modal.classList.add('mostrar');
      video.play();
    };
  } catch (error) {
    console.error('Error creando timelapse:', error);
  }
}

function toggleTimelapse() {
  const btnTimelapse = document.getElementById('btnTimelapse');
  
  if (!reproduciendo && !timelapseFinalizado) {
    reproduciendo = true;
    btnTimelapse.textContent = '⏸️ Timelapse';
    btnTimelapse.classList.add('pausado');
    crearTimelapse();
  } else {
    cerrarTimelapse();
  }
}

function cerrarTimelapse() {
  const modal = document.getElementById('modalTimelapse');
  const video = document.getElementById('timelapseVideo');
  const btnTimelapse = document.getElementById('btnTimelapse');
  
  reproduciendo = false;
  timelapseFinalizado = false;
  
  btnTimelapse.textContent = '▶️ Timelapse';
  btnTimelapse.classList.remove('pausado');
  
  if (intervaloFrames) {
    clearInterval(intervaloFrames);
    intervaloFrames = null;
  }
  
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  
  if (video.srcObject) {
    video.srcObject = null;
  }
  
  if (canvas) {
    canvas = null;
    ctx = null;
  }
  
  modal.classList.remove('mostrar');
  document.getElementById('btnReiniciar').classList.remove('visible');
}

async function filtrar() {
  const fecha = document.getElementById("fechaInput").value;
  
  if (!fecha) {
    verTodas();
    return;
  }

  modoFiltro = true;
  clearInterval(intervalo);
  
  mostrarErrorTemporal('🔍 Filtrando imágenes...');
  
  try {
    const res = await fetch(`/imagenes/${fecha}`);
    if (!res.ok) throw new Error('No hay imágenes');
    const data = await res.json();
    imagenesActuales = data;
    renderizar(data);
  } catch (error) {
    console.error('Error filtro:', error);
    mostrarErrorTemporal('❌ No hay imágenes para esta fecha');
  }
}

function renderizar(lista) {
  const galeria = document.getElementById("galeria");
  
  if (lista.length === 0) {
    galeria.innerHTML = `
      <div style="grid-column: 1 / -1; text-align:center; padding:80px; color:#666; font-size:18px;">
        📷 No hay imágenes disponibles
        <br><small>Intenta otra fecha o espera nuevas capturas</small>
      </div>
    `;
    return;
  }

  galeria.innerHTML = "";
  
  lista.slice().reverse().forEach((img, index) => {
    const div = document.createElement("div");
    div.className = "img-card";
    div.style.animationDelay = `${index * 0.05}s`;
    
    const fecha = new Date(img.created_at);
    const fechaFormato = fecha.toLocaleDateString('es-ES');
    const horaFormato = fecha.toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
    
    div.innerHTML = `
      <img src="${img.url}" alt="Invernadero ${horaFormato}" loading="lazy" />
      <div class="overlay">
        <div class="icono-camara">📷</div>
        <div style="font-size:18px; margin-bottom:8px;">Ver imagen</div>
        <div style="font-size:14px; opacity:0.9;">${horaFormato}</div>
      </div>
      <div class="info">
        <div class="fecha">${fechaFormato}</div>
        <div class="hora">${horaFormato}</div>
      </div>
    `;
    
    div.onclick = () => {
      window.open(img.url, '_blank');
    };
    
    galeria.appendChild(div);
  });
}

function iniciarAutoRefresh() {
  clearInterval(intervalo);
  intervalo = setInterval(async () => {
    if (!modoFiltro) {
      await cargarImagenes();
    }
  }, 60000);
}

// Event listeners
document.getElementById('btnTimelapse').addEventListener('click', toggleTimelapse);

// Inicializar
document.addEventListener('DOMContentLoaded', () => {
  const hoy = new Date().toISOString().split('T')[0];
  document.getElementById('fechaInput').value = hoy;
  
  verTodas();
});
</script>

</body>
</html>
