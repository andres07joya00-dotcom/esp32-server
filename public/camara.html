<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Galería - Invernadero</title>
  <style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #d9e8a1 0%, #a8d5ba 50%, #87c4a3 100%);
  min-height: 100vh;
  padding: 20px;
  overflow-x: hidden;
}

.header {
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  padding: 20px 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.titulo {
  font-size: 36px;
  font-weight: 800;
  background: linear-gradient(135deg, #2c5530, #4CAF50);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin: 0;
  letter-spacing: -0.5px;
}

.controles {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.filtros {
  display: flex;
  gap: 12px;
  align-items: center;
  background: rgba(255,255,255,0.9);
  padding: 12px 20px;
  border-radius: 25px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.15);
  backdrop-filter: blur(10px);
}

#fechaInput {
  padding: 12px 16px;
  border: 2px solid #4CAF50;
  border-radius: 20px;
  font-size: 16px;
  background: white;
  color: #333;
  font-weight: 500;
  transition: all 0.3s;
  min-width: 180px;
}

#fechaInput:focus {
  outline: none;
  border-color: #45a049;
  box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2);
  transform: scale(1.02);
}

.btn-filtrar, .btn-limpiar, .btn-timelapse {
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-filtrar {
  background: linear-gradient(135deg, #4CAF50, #45a049);
  color: white;
}

.btn-filtrar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
}

.btn-limpiar {
  background: linear-gradient(135deg, #8a8f70, #6b7a4f);
  color: white;
}

.btn-limpiar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(138, 143, 112, 0.4);
}

.btn-timelapse {
  background: linear-gradient(135deg, #FF6B35, #F7931E);
  color: white;
  animation: pulsoNaranja 2s infinite;
}

.btn-timelapse:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
}

/* Modal Timelapse */
.modal-timelapse {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.98);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.modal-timelapse.mostrar {
  display: flex;
}

.video-container {
  position: relative;
  width: 100%;
  max-width: 1200px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* EL CANVAS ES EL REPRODUCTOR */
#timelapseCanvas {
  width: 100%;
  max-width: 1200px;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 12px;
  background: #000;
  display: block;
}

.cerrar-modal {
  position: absolute;
  top: -50px;
  right: 0px;
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
  z-index: 10;
}

.cerrar-modal:hover {
  background: rgba(255,255,255,0.4);
  transform: scale(1.1);
}

/* Barra de progreso + controles */
.controles-timelapse {
  position: absolute;
  bottom: -70px;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

.barra-progreso {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  overflow: hidden;
}

.progreso-fill {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50, #F7931E);
  border-radius: 3px;
  transition: width 0.05s linear;
  width: 0%;
}

.botones-control {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn-control {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}

.btn-control:hover {
  background: rgba(255,255,255,0.3);
  transform: scale(1.05);
}

.btn-control.verde {
  background: rgba(76,175,80,0.8);
}

.contador-frames {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  font-weight: 500;
}

/* Overlay de carga dentro del modal */
.cargando-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  border-radius: 12px;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 20px;
  color: white;
  z-index: 20;
}

.cargando-overlay.visible {
  display: flex;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: #4CAF50;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.cargando-texto {
  font-size: 16px;
  font-weight: 600;
}

.cargando-progreso {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Galería */
.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  max-width: 1400px;
  width: 100%;
  margin: 40px auto;
  padding: 0 10px;
}

.img-card {
  position: relative;
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
  animation: fadeInUp 0.6s ease-out forwards;
}

.img-card:hover {
  transform: translateY(-12px) scale(1.02);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

.img-card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  transition: transform 0.4s;
}

.img-card:hover img {
  transform: scale(1.05);
}

.info {
  padding: 18px;
  background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
}

.fecha {
  font-size: 14px;
  color: #666;
  font-weight: 500;
  margin: 0;
}

.hora {
  font-size: 13px;
  color: #999;
  margin-top: 4px;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(45deg, rgba(76,175,80,0.9), rgba(69,160,73,0.9));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 0.3s;
  color: white;
  font-weight: bold;
}

.img-card:hover .overlay {
  opacity: 1;
}

.icono-camara {
  font-size: 48px;
  margin-bottom: 10px;
}

.volver {
  position: fixed;
  top: 25px;
  left: 25px;
  z-index: 1000;
  padding: 14px 20px;
  border-radius: 50px;
  background: rgba(255,255,255,0.95);
  border: none;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  color: #2c5530;
  transition: all 0.3s;
  backdrop-filter: blur(20px);
}

.volver:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

@keyframes pulsoNaranja {
  0%, 100% { box-shadow: 0 0 20px rgba(255,107,53,0.5); }
  50% { box-shadow: 0 0 30px rgba(255,107,53,0.8); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .galeria { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
  .titulo { font-size: 28px; }
  .controles { flex-direction: column; gap: 15px; }
  .filtros { width: 100%; justify-content: center; flex-wrap: wrap; }
  #timelapseCanvas { max-height: 60vw; }
  .controles-timelapse { bottom: -90px; }
}

@media (max-width: 480px) {
  .galeria { grid-template-columns: 1fr; gap: 20px; }
  body { padding: 15px; }
}
  </style>
</head>
<body>

<button class="volver" onclick="volver()">⬅️ Dashboard</button>

<div class="header">
  <h1 class="titulo">📸 Feed del Invernadero</h1>
  <div class="controles">
    <div class="filtros">
      <input type="date" id="fechaInput">
      <button class="btn-filtrar" onclick="filtrar()">🔍 Filtrar</button>
      <button class="btn-limpiar" onclick="verTodas()">📷 Ver todas</button>
      <button class="btn-timelapse" id="btnTimelapse" onclick="abrirTimelapse()">▶️ Timelapse</button>
    </div>
  </div>
</div>

<div class="galeria" id="galeria"></div>

<!-- Modal Timelapse -->
<div class="modal-timelapse" id="modalTimelapse">
  <div class="video-container">

    <!-- Botón cerrar -->
    <button class="cerrar-modal" onclick="cerrarTimelapse()">✕</button>

    <!-- Canvas = pantalla del timelapse -->
    <canvas id="timelapseCanvas"></canvas>

    <!-- Overlay de carga -->
    <div class="cargando-overlay" id="cargandoOverlay">
      <div class="spinner"></div>
      <div class="cargando-texto">⚡ Cargando imágenes...</div>
      <div class="cargando-progreso" id="cargandoProgreso">0 / 0</div>
    </div>

    <!-- Controles debajo del canvas -->
    <div class="controles-timelapse">
      <div class="barra-progreso">
        <div class="progreso-fill" id="progresoFill"></div>
      </div>
      <div class="botones-control">
        <button class="btn-control" id="btnPausaPlay" onclick="togglePausa()">⏸ Pausar</button>
        <button class="btn-control verde" onclick="reiniciarTimelapse()">🔄 Reiniciar</button>
        <span class="contador-frames" id="contadorFrames">0 / 0</span>
      </div>
    </div>

  </div>
</div>

<script>
  
let modoFiltro    = false;
let intervalo     = null;
let imagenesActuales = [];

// Timelapse
let frames        = [];   // HTMLImageElement[]
let frameActual   = 0;
let reproduciendo = false;
let pausado       = false;
let animationId   = null;
let ultimoTiempo  = 0;

const FPS         = 10;           // frames por segundo (ajustable)
const FRAME_DELAY = 1000 / FPS;

function volver() {
  window.location.href = "/dashboard.html";
}

async function cargarImagenes() {
  try {
    const res = await fetch("/imagenes");
    if (!res.ok) throw new Error();
    const data = await res.json();
    imagenesActuales = data;
    renderizar(data);
    return data;
  } catch {
    mostrarMensaje("🔌 Conectando con cámara...");
    return [];
  }
}

function mostrarMensaje(msg) {
  document.getElementById("galeria").innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:#666;font-size:18px;">
      ${msg}
    </div>`;
}

async function verTodas() {
  modoFiltro = false;
  document.getElementById("fechaInput").value = "";
  mostrarMensaje("📱 Cargando imágenes...");
  const data = await cargarImagenes();
  if (data.length === 0) mostrarMensaje("📷 No hay imágenes");
  iniciarAutoRefresh();
}

async function filtrar() {
  const fecha = document.getElementById("fechaInput").value;
  if (!fecha) { verTodas(); return; }
  modoFiltro = true;
  clearInterval(intervalo);
  mostrarMensaje("🔍 Filtrando...");
  try {
    const res = await fetch(`/imagenes/${fecha}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    imagenesActuales = data;
    renderizar(data);
  } catch {
    mostrarMensaje("❌ No hay imágenes para esa fecha");
  }
}

function renderizar(lista) {
  const galeria = document.getElementById("galeria");
  if (lista.length === 0) {
    galeria.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:80px;color:#666;">
        📷 No hay imágenes
      </div>`;
    return;
  }
  galeria.innerHTML = "";
  lista.slice().reverse().forEach(img => {
    const div  = document.createElement("div");
    div.className = "img-card";
    const fecha = new Date(img.created_at);
    div.innerHTML = `
      <img src="${img.url}" loading="lazy">
      <div class="overlay"><div class="icono-camara">📷</div></div>
      <div class="info">
        <div class="fecha">${fecha.toLocaleDateString('es-ES')}</div>
        <div class="hora">${fecha.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>`;
    div.onclick = () => window.open(img.url, "_blank");
    galeria.appendChild(div);
  });
}

function iniciarAutoRefresh() {
  clearInterval(intervalo);
  intervalo = setInterval(() => {
    if (!modoFiltro) cargarImagenes();
  }, 60000);
}

// 1. Abrir modal y empezar carga
async function abrirTimelapse() {

  if (imagenesActuales.length === 0) {
    alert("No hay imágenes para el timelapse");
    return;
  }

  // Mostrar modal con pantalla de carga
  document.getElementById("modalTimelapse").classList.add("mostrar");
  document.getElementById("cargandoOverlay").classList.add("visible");
  document.getElementById("cargandoProgreso").textContent = "0 / 0";
  document.getElementById("btnPausaPlay").textContent = "⏸ Pausar";

  // Preparar canvas
  const canvas = document.getElementById("timelapseCanvas");
  const ctx    = canvas.getContext("2d");

  // Reducir frames si hay muchos (máx 400)
  let lista = imagenesActuales;
  if (lista.length > 400) {
    const salto = Math.ceil(lista.length / 400);
    lista = lista.filter((_, i) => i % salto === 0);
  }

  // Precargar imágenes con progreso
  frames = await precargarConProgreso(lista);

  if (frames.length === 0) {
    alert("No se pudieron cargar las imágenes");
    cerrarTimelapse();
    return;
  }

  // Ajustar tamaño del canvas a la primera imagen
  canvas.width  = frames[0].naturalWidth  || 960;
  canvas.height = frames[0].naturalHeight || 540;

  // Ocultar overlay de carga y arrancar
  document.getElementById("cargandoOverlay").classList.remove("visible");

  frameActual   = 0;
  reproduciendo = true;
  pausado       = false;
  ultimoTiempo  = performance.now();

  // Dibujar primer frame inmediatamente
  dibujarFrame(ctx, canvas, 0);
  actualizarUI();

  // Arrancar el loop
  animationId = requestAnimationFrame(
    (t) => loopTimelapse(t, ctx, canvas)
  );
}

// 2. Precarga con progreso visual
function precargarConProgreso(lista) {
  return new Promise(resolve => {
    const total    = lista.length;
    let cargadas   = 0;
    const imagenes = [];

    function actualizar() {
      cargadas++;
      document.getElementById("cargandoProgreso")
        .textContent = `${cargadas} / ${total}`;
      if (cargadas === total) {
        resolve(imagenes.filter(Boolean));
      }
    }

    lista.forEach((imgData, i) => {
      const img    = new Image();
      img.crossOrigin = "anonymous";   // evita errores CORS en canvas
      img.onload  = () => { imagenes[i] = img; actualizar(); };
      img.onerror = () => { imagenes[i] = null; actualizar(); };
      img.src     = imgData.url;
    });
  });
}

// 3. Loop de animación con requestAnimationFrame
function loopTimelapse(tiempo, ctx, canvas) {

  if (!reproduciendo) return;   // parado → no continuar

  if (!pausado) {
    const delta = tiempo - ultimoTiempo;

    if (delta >= FRAME_DELAY) {
      dibujarFrame(ctx, canvas, frameActual);
      actualizarUI();
      frameActual++;
      ultimoTiempo = tiempo;

      // ¿Terminó?
      if (frameActual >= frames.length) {
        reproduciendo = false;
        document.getElementById("btnPausaPlay").textContent = "✅ Terminado";
        return;  // salir del loop → se muestra el último frame
      }
    }
  }

  // Seguir el loop
  animationId = requestAnimationFrame(
    (t) => loopTimelapse(t, ctx, canvas)
  );
}

// 4. Dibujar un frame en el canvas
function dibujarFrame(ctx, canvas, indice) {
  const img = frames[indice];
  if (!img) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
}

// 5. Actualizar barra de progreso y contador
function actualizarUI() {
  const total    = frames.length;
  const actual   = frameActual + 1;
  const pct      = total > 0 ? (actual / total) * 100 : 0;

  document.getElementById("progresoFill").style.width  = pct + "%";
  document.getElementById("contadorFrames").textContent = `${actual} / ${total}`;
}

// 6. Pausar / Reanudar
function togglePausa() {
  if (!reproduciendo && !pausado) return; // ya terminó

  pausado = !pausado;
  document.getElementById("btnPausaPlay").textContent =
    pausado ? "▶️ Reanudar" : "⏸ Pausar";

  // Si reanudamos, relanzar el loop
  if (!pausado) {
    reproduciendo = true;
    ultimoTiempo  = performance.now();
    const canvas  = document.getElementById("timelapseCanvas");
    const ctx     = canvas.getContext("2d");
    animationId   = requestAnimationFrame(
      (t) => loopTimelapse(t, ctx, canvas)
    );
  }
}

// 7. Reiniciar desde el frame 0
function reiniciarTimelapse() {
  cancelAnimationFrame(animationId);

  frameActual   = 0;
  reproduciendo = true;
  pausado       = false;
  ultimoTiempo  = performance.now();

  document.getElementById("btnPausaPlay").textContent = "⏸ Pausar";

  const canvas = document.getElementById("timelapseCanvas");
  const ctx    = canvas.getContext("2d");

  dibujarFrame(ctx, canvas, 0);
  actualizarUI();

  animationId = requestAnimationFrame(
    (t) => loopTimelapse(t, ctx, canvas)
  );
}

// 8. Cerrar modal y limpiar todo
function cerrarTimelapse() {
  reproduciendo = false;
  pausado       = false;
  cancelAnimationFrame(animationId);

  document.getElementById("modalTimelapse").classList.remove("mostrar");
  document.getElementById("cargandoOverlay").classList.remove("visible");

  // Limpiar canvas
  const canvas = document.getElementById("timelapseCanvas");
  const ctx    = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Liberar memoria
  frames      = [];
  frameActual = 0;

  document.getElementById("progresoFill").style.width     = "0%";
  document.getElementById("contadorFrames").textContent   = "0 / 0";
  document.getElementById("btnPausaPlay").textContent     = "⏸ Pausar";
}

document.addEventListener("DOMContentLoaded", () => {
  const hoy = new Date().toISOString().split("T")[0];
  document.getElementById("fechaInput").value = hoy;
  verTodas();
});

</script>
</body>
</html>
